<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受注→弥生販売 統合変換ツール ver 4.0</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .business-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .business-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            border: 3px solid transparent;
        }

        .business-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .business-card.retail {
            border-color: #FF6B9D;
        }

        .business-card.retail:hover {
            background: #fff5f8;
        }

        .business-card.wholesale {
            border-color: #667eea;
        }

        .business-card.wholesale:hover {
            background: #f5f7ff;
        }

        .business-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .business-card h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .business-card.retail h2 {
            color: #FF6B9D;
        }

        .business-card.wholesale h2 {
            color: #667eea;
        }

        .business-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .business-card .source {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 13px;
            color: #555;
        }

        .top-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .top-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .top-header .version {
            display: inline-block;
            background: rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: 10px;
        }

        .top-header p {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-header">
            <h1>受注→弥生販売 統合変換ツール <span class="version">ver 4.0</span></h1>
            <p>各種受注データを弥生販売の売上伝票形式に変換</p>
        </div>

        <div class="business-select">
            <!-- 小売販売カード -->
            <a href="retail.html" class="business-card retail">
                <div class="business-icon">🛍️</div>
                <h2>小売販売</h2>
                <p>カラーミーショップの受注データを<br>弥生販売の売上伝票に変換</p>
                <div class="source">
                    データ元：カラーミーショップ CSV
                </div>
            </a>

            <!-- 卸販売カード -->
            <a href="wholesale.html" class="business-card wholesale">
                <div class="business-icon">🏭</div>
                <h2>卸販売</h2>
                <p>卸売取引先からの注文データを<br>弥生販売の売上伝票に変換</p>
                <div class="source">
                    対応取引先：やつは様・山善様
                </div>
            </a>
        </div>
    </div>
</body>
</html>
